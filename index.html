<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparable Company Analysis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9EBEC; --surface:#FFFFFF; --ink:#0D1117; --ink70:#3A434D;
    --muted:#68727D; --rule:#D2D7DB; --rule-soft:#E2E6E9;
    --s1:#0B6E5F; --s2:#3F9C8B; --s3:#8A9199; --s4:#D08A2C; --s5:#A83250;
    --display:Archivo,'Helvetica Neue',Arial,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);min-height:100vh}
  button{font:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--rule);padding:18px}

  header{border-bottom:1px solid var(--rule);background:var(--surface);padding:16px 22px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .masthead h1{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.03em;line-height:1}
  .masthead p{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
  nav.tabs{display:flex;border:1px solid var(--ink)}
  nav.tabs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:9px 18px;border:none;background:transparent;color:var(--ink)}
  nav.tabs button.on{background:var(--ink);color:#fff}

  .layout{display:flex;align-items:stretch;flex-wrap:wrap}
  aside{width:236px;flex-shrink:0;border-right:1px solid var(--rule);background:var(--surface);padding:18px 0;min-width:200px}
  aside .eyebrow{padding:0 18px 10px}
  .sector-btn{width:100%;text-align:left;border:none;border-left:3px solid transparent;background:transparent;
    padding:9px 18px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .sector-btn span.nm{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:-.01em;color:var(--ink)}
  .sector-btn span.ct{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .sector-btn.on{background:#F1F3F4;border-left-color:var(--ink)}
  .sector-btn.on span.nm{font-weight:700}
  .rail-note{padding:18px 18px 0;margin-top:10px;border-top:1px solid var(--rule-soft)}
  .rail-note .big{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;margin-top:8px}
  .rail-note .also{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
  .rail-note p{font-size:12px;color:var(--ink70);line-height:1.5;margin-top:10px}

  main{flex:1;min-width:320px;padding:20px 22px 40px}
  .headrow{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .headrow h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
  .headrow h2 small{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink70);letter-spacing:0;margin-left:10px}
  .headrow .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}

  /* industry filter */
  .ind-wrap{margin-bottom:18px}
  .inds{display:flex;flex-wrap:wrap;gap:6px}
  .ind{font-family:var(--mono);font-size:11px;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);
    color:var(--ink70);display:inline-flex;gap:7px;align-items:baseline}
  .ind span{color:var(--muted);font-size:10px}
  .ind:hover{border-color:var(--ink);color:var(--ink)}
  .ind.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .ind.on span{color:#B9C0C7}

  .boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
  .sbox{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--ink);
    padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sbox .val{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;letter-spacing:-.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sbox .sub{font-family:var(--mono);font-size:12px;color:var(--ink70)}
  .sbox .foot{font-size:11.5px;color:var(--muted);line-height:1.4}

  /* implied valuation card */
  .val-card{margin-bottom:18px}
  .val-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:14px}
  .val-lede{font-size:12.5px;color:var(--ink70);line-height:1.5;max-width:560px;margin-top:6px}
  .val-pick{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .val-pick label{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .val-pick select,.val-pick input{font:500 13px var(--mono);padding:8px 10px;border:1px solid var(--ink);
    background:var(--surface);color:var(--ink);letter-spacing:0;text-transform:none;border-radius:0}
  .val-pick select{min-width:190px}
  .val-pick input{width:110px;text-transform:uppercase}
  .val-inp{display:flex}
  .val-inp button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 12px;border:1px solid var(--ink);border-left:none;background:var(--ink);color:#fff}
  .val-empty{font-size:13px;color:var(--ink70);line-height:1.5;padding:6px 0 2px}
  .val-facts{display:flex;gap:26px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--rule-soft);
    border-bottom:1px solid var(--rule-soft);margin-bottom:14px}
  .val-facts .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .val-facts .v{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-top:3px}
  .val-facts .v small{font-weight:400;color:var(--muted);font-size:10.5px;margin-left:4px}
  .val-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .val-m{border:1px solid var(--rule);border-top:3px solid var(--ink);padding:14px 16px;min-width:0}
  .val-m .px{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
  .val-m .up{font-family:var(--mono);font-size:11.5px;margin-top:4px;line-height:1.4}
  .val-bridge{margin-top:12px;border-top:1px solid var(--rule-soft);padding-top:8px}
  .val-bridge div{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
  .val-bridge div span:first-child{color:var(--ink70)}
  .val-bridge div span:last-child{font-family:var(--mono);white-space:nowrap}
  .val-bridge div.tot span{font-weight:600;color:var(--ink)}
  .val-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:12px}

  .chart-card{margin-bottom:18px}
  .chart-card .cap{margin-bottom:12px}
  .chart-wrap{position:relative;width:100%}
  .chart-scroll{overflow-x:auto}
  .legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink70)}
  .legend i{width:10px;height:10px;display:inline-block}

  .tbl-card{padding:0;overflow:hidden}
  .tbl-card .cap{padding:16px 18px 12px;border-bottom:1px solid var(--rule-soft)}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th{text-align:right;padding:10px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer;user-select:none;
    border-bottom:1px solid var(--rule)}
  th.l{text-align:left} th:hover{color:var(--ink)} th.on{color:var(--ink)}
  td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);font-size:12.5px;text-align:right}
  td.l{text-align:left}
  td.tk{font-family:var(--mono);font-size:12px;font-weight:600}
  td.co{color:var(--ink70);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.in{font-family:var(--mono);font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.mn{font-family:var(--mono);font-size:12px;color:var(--ink70)}
  td.pv{font-family:var(--mono);font-size:12.5px;font-weight:600}
  tr:hover td{background:#F5F7F8}
  .scorebar{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
  .scorebar .trk{width:44px;height:5px;background:var(--rule-soft);display:inline-block}
  .scorebar .fil{height:100%;display:block}
  .scorebar b{font-family:var(--mono);font-size:12px;min-width:20px;text-align:right}

  .footer-note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:16px;line-height:1.7}
  .linkbtns{display:flex;gap:14px;margin-top:10px}
  .linkbtn{background:none;border:none;padding:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink70);text-decoration:underline}

  .diag{margin-top:14px;border-top:1px solid var(--rule-soft);padding-top:14px}
  .diag-row{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:11px;line-height:1.5;
    padding:6px 8px;margin-top:6px;border-left:2px solid var(--s5);background:rgba(168,50,80,.06)}
  .diag-row.ok{border-left-color:var(--s1);background:rgba(11,110,95,.06)}
  .diag-row .st{min-width:34px;font-weight:600;color:var(--s5)} .diag-row.ok .st{color:var(--s1)}
  .diag-row .lb{min-width:150px;color:var(--ink)}
  .diag-row .ms{color:var(--muted);word-break:break-word;flex:1}

  .prog{height:4px;background:var(--rule-soft);margin-top:14px}
  .prog i{display:block;height:100%;background:var(--ink);width:0}
  .bignum{font-family:var(--display);font-size:30px;font-weight:700;margin-top:8px}
  .load-note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}

  .err-card{border-left:3px solid var(--s5)}
  .err-card .eyebrow{color:var(--s5)}
  .err-card p{font-size:14px;margin-top:8px;line-height:1.55}
  .retry{margin-top:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 16px;background:var(--ink);color:#fff;border:none}

  /* methodology */
  .method{padding:26px 22px 48px;max-width:1080px;margin:0 auto}
  .method h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.025em}
  .method .lede{font-size:14px;color:var(--ink70);line-height:1.6;margin-top:8px;max-width:720px}
  .mtable th{cursor:default;border-bottom:1px solid var(--ink)}
  .mtable td{vertical-align:top;text-align:left;padding:16px}
  .mtable .sec{font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap}
  .mtable .peers{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400;margin-top:4px}
  .chip{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--ink);padding:4px 8px;white-space:nowrap}
  .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--ink70);color:var(--ink70);padding:2px 6px;margin-top:8px}
  .mtable .secm{font-family:var(--mono);font-size:12px;color:var(--ink70)}
  .mtable .why{font-size:13px;color:var(--ink70);line-height:1.55;max-width:360px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:26px 0}
  .mgrid ol{padding-left:18px;font-size:13px;line-height:1.7;color:var(--ink70)}
  .mgrid p{font-size:13px;color:var(--ink70);line-height:1.6}
  .scale{display:flex;height:10px;margin-bottom:10px}.scale i{flex:1}
  .scale-lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 26px}
  .defs .k{font-family:var(--mono);font-size:12px;font-weight:600;margin-bottom:4px}
  .defs .v{font-size:12.5px;color:var(--ink70);line-height:1.55}

  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

<div id="view-method" class="method hidden"></div>

/* Valuation approach per sector. Asset-heavy sectors are priced on EV/EBIT.
   P/E is in every sector's secondary list, so it appears in the table, the cross-check chart and the blended score. */
const SECTOR_CFG = [
  {id:"tech", src:"Information Technology", primary:"evEbitda", secondary:["evSales","evFcf","pe"],
   why:"Generally asset-light with strong margins; EBITDA and FCF capture operating economics well, Sales covers the unprofitable."},
  {id:"comm", src:"Communication Services", primary:"evEbitda", secondary:["evFcf","evSales","pe"],
   why:"EBITDA works well for mature telecom and media; Sales useful for earlier-stage platforms."},
  {id:"cd", src:"Consumer Discretionary", primary:"evEbitda", secondary:["evFcf","pe"],
   why:"Useful for mature businesses with established earnings."},
  {id:"staples", src:"Consumer Staples", primary:"evEbitda", secondary:["evFcf","pe"],
   why:"Mature, predictable cash flows and relatively stable margins."},
  {id:"hc", src:"Health Care", label:"Health Care / Pharma", primary:"evEbitda", secondary:["evFcf","evSales","pe"],
   why:"EBITDA useful for established companies; Sales useful for biotech and low-profit businesses."},
  {id:"fins", src:"Financials", label:"Financials / Banks & Insurers", primary:"pb", secondary:["pe","roe"],
   why:"Debt is part of the operating model, making EV-based multiples less meaningful."},
  {id:"inds", src:"Industrials", primary:"evEbit", secondary:["evEbitda","evFcf","pe"], asset:true,
   why:"Asset intensive; EBIT charges depreciation, the real cost of keeping plant, fleets and equipment running."},
  {id:"mats", src:"Materials", primary:"evEbit", secondary:["evEbitda","evFcf","pe"], asset:true,
   why:"Plants, mines and mills wear out; EBIT captures that cost where EBITDA flatters heavy-capex producers."},
  {id:"energy", src:"Energy", primary:"evEbit", secondary:["evEbitda","evOcf","pe"], asset:true,
   why:"Capital heavy and cyclical; EBIT reflects depletion and depreciation of reserves and rigs, OCF cross-checks through the cycle."},
  {id:"utils", src:"Utilities", primary:"evEbit", secondary:["evEbitda","pe"], asset:true,
   why:"Regulated asset bases where depreciation is a real, recovered cost, so EBIT is the fair operating measure. FCF is usually negative from heavy capex, so P/E is the cross-check."},
  {id:"re", src:"Real Estate", primary:"evEbitda", secondary:["pb","evOcf","pe"],
   why:"Asset heavy, but property depreciation is an accounting charge that understates value, so EBITDA (the closest proxy to FFO) is used rather than EBIT. P/B tracks NAV; OCF approximates AFFO."}
];

/* ticker -> {name, industry, sector} from the constituent list */
const INFO = {};
const SECTORS = SECTOR_CFG.map(c=>{
  const list = UNIVERSE[c.src] || [];
  const byInd = {};
  list.forEach(([t,name,ind])=>{
    INFO[t] = {name, industry:ind, sector:c.id};
    (byInd[ind] = byInd[ind] || []).push(t);
  });
  const industries = Object.keys(byInd).map(n=>({name:n, tickers:byInd[n]}))
    .sort((a,b)=>b.tickers.length-a.tickers.length || a.name.localeCompare(b.name));
  return Object.assign({name:c.src}, c, {tickers:list.map(r=>r[0]), industries});
});

/* ============================ HELPERS ============================ */

function pick(obj, names){
  if(!obj) return null;
  const lower = {};
  Object.keys(obj).forEach(k => lower[k.toLowerCase()] = obj[k]);
  for(const n of names){
    const v = lower[n.toLowerCase()];
    if(v !== undefined && v !== null && v !== ""){
      const num = typeof v === "number" ? v : parseFloat(v);
      if(!Number.isNaN(num)) return num;
    }
  }
  return null;
}
function pickStr(obj, names){
  if(!obj) return null;
  const lower = {};
  Object.keys(obj).forEach(k => lower[k.toLowerCase()] = obj[k]);
  for(const n of names){
    const v = lower[n.toLowerCase()];
    if(typeof v === "string" && v.trim()) return v.trim();
  }
  return null;
}
function clean(v, key){
  if(v === null || v === undefined || !isFinite(v)) return null;
  const m = METRICS[key];
  if(!m) return v;
  if(m.better === "low" && v <= 0) return null;
  if(Math.abs(v) > m.max) return null;
  return v;
}
const median = a => {
  const s = a.filter(v => v !== null && v !== undefined && isFinite(v)).sort((x,y)=>x-y);
  if(!s.length) return null;
  const m = Math.floor(s.length/2);
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
};
function pctRank(value, values){
  const a = values.filter(v => v !== null && v !== undefined && isFinite(v)).sort((x,y)=>x-y);
  if(!a.length) return null;
  const below = a.filter(v=>v<value).length, equal = a.filter(v=>v===value).length;
  return (below + equal/2) / a.length;
}
function relColor(rel, better){
  let r = better === "high" ? -rel : rel;
  if(r === null || !isFinite(r)) return C.s3;
  const stops = [[-0.5,[11,110,95]],[-0.2,[63,156,139]],[0,[138,145,153]],[0.3,[208,138,44]],[0.8,[168,50,80]]];
  if(r <= stops[0][0]) return `rgb(${stops[0][1]})`;
  if(r >= stops[4][0]) return `rgb(${stops[4][1]})`;
  for(let i=0;i<4;i++){
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if(r>=a && r<=b){
      const t=(r-a)/(b-a);
      return `rgb(${ca.map((v,j)=>Math.round(v+(cb[j]-v)*t))})`;
    }
  }
  return C.s3;
}

const nm = "n.m.";
const fx = v => (v===null||v===undefined||!isFinite(v)) ? nm : v.toFixed(1)+"x";
const fpct = (v,d=1) => (v===null||v===undefined||!isFinite(v)) ? nm : (v*100).toFixed(d)+"%";
const fsigned = v => (v===null||v===undefined||!isFinite(v)) ? nm : (v>0?"+":"")+(v*100).toFixed(0)+"%";
const fcap = v => {
  if(!v||!isFinite(v)) return "—";
  if(v>=1e12) return "$"+(v/1e12).toFixed(2)+"T";
  if(v>=1e9) return "$"+(v/1e9).toFixed(1)+"B";
  if(v>=1e6) return "$"+(v/1e6).toFixed(0)+"M";
  return "$"+v.toFixed(0);
};
const fmoney = v => (v===null||v===undefined||!isFinite(v)) ? "—" : v===0 ? "$0" : (v<0?"−":"")+fcap(Math.abs(v));
const fshares = v => (!v||!isFinite(v)) ? "—" : v>=1e9 ? (v/1e9).toFixed(2)+"B" : (v/1e6).toFixed(1)+"M";
const fprice = v => (v===null||v===undefined||!isFinite(v)) ? nm : "$"+v.toFixed(2);
const fmtM = (v,key) => METRICS[key].unit==="%" ? fpct(v) : fx(v);
const fage = ts => { const m = Math.round((Date.now()-ts)/60000); return m<1 ? "just now" : m<60 ? m+"m ago" : Math.round(m/60)+"h ago"; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));

                        : `${BASE}/stable/cash-flow-statement?symbol=${t}&period=quarter&limit=4&apikey=${API_KEY}`
};
const redact = u => u.replace(API_KEY, "…"+API_KEY.slice(-4));

/* With ~80 companies per sector, back off and retry when FMP rate-limits (HTTP 429). */
async function getArr(url, tries=3){
  const res = await fetch(url);
  if(res.status===429 && tries>0){ await sleep(1200*(4-tries)); return getArr(url, tries-1); }
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j = await res.json();
  if(j && !Array.isArray(j) && (j["Error Message"]||j.message)) throw new Error(j["Error Message"]||j.message);
  return Array.isArray(j) ? j : (j && typeof j==="object" ? [j] : []);
}
async function safeArr(url){ try{ const a = await getArr(url); return a; }catch(e){ return []; } }

async function probeURL(label, url){
  const t0 = Date.now();
  try{
    const res = await fetch(url);
    const text = await res.text();
    let json = null; try{ json = JSON.parse(text); }catch(e){}
    const arr = Array.isArray(json) ? json : (json && typeof json==="object" ? [json] : []);
    const apiMsg = json && !Array.isArray(json) ? (json["Error Message"]||json.message||json.error||null) : null;
    return {label, url:redact(url), status:res.status, count:apiMsg?0:arr.length,
      ok:res.ok && !apiMsg && arr.length>0,
      msg:apiMsg || (res.ok ? (arr.length?null:"empty array") : text.slice(0,160)),
      ms:Date.now()-t0};
  }catch(e){
    return {label, url:redact(url), status:0, count:0, ok:false,
      msg:e.name+": "+e.message+" — request never completed (network block or CORS)", ms:Date.now()-t0};
  }
}

const diag = { probed:false, plan:null, log:[] };

async function runProbe(){
  const S = "AAPL";
  diag.log = [];
  let base = "stable";
  let p = await probeURL("stable · profile", URLS.profile("stable",S)); diag.log.push(p);
  if(!p.ok){
    const v3 = await probeURL("v3 · profile", URLS.profile("v3",S)); diag.log.push(v3);
    if(v3.ok){ base="v3"; p=v3; }
  }
  let q = {ok:false};
  if(!p.ok){ q = await probeURL(base+" · quote", URLS.quote(base,S)); diag.log.push(q); }
  const km = await probeURL(base+" · key-metrics-ttm", URLS.km(base,S)); diag.log.push(km);
  const ra = await probeURL(base+" · ratios-ttm", URLS.ratios(base,S)); diag.log.push(ra);
  const inc = await probeURL(base+" · income-statement", URLS.income(base,S)); diag.log.push(inc);

  const plan = {base, hasProfile:p.ok, hasQuote:q.ok, hasKM:km.ok, hasRatios:ra.ok, hasStatements:inc.ok};
  plan.mode = plan.hasKM ? (plan.hasRatios ? "metrics" : "metrics+computed")
            : (plan.hasStatements ? "computed" : "none");
  plan.reachable = plan.hasProfile || plan.hasQuote || plan.hasKM || plan.hasStatements;
  diag.plan = plan; diag.probed = true;
  return plan;
}

const sumQ = (rows,names) => rows.reduce((s,r)=>{const v=pick(r,names); return v===null?s:s+v;},0);

async function computeFromStatements(t, base, marketCap){
  const [inc, bal, cf] = await Promise.all([
    safeArr(URLS.income(base,t)), safeArr(URLS.balance(base,t)), safeArr(URLS.cash(base,t))
  ]);
  if(!inc.length) return null;
  const q = inc.slice(0,4);
  const revenue = sumQ(q,["revenue","totalRevenue"]);
  const ebitda = sumQ(q,["ebitda","EBITDA"]);
  const ebit = sumQ(q,["operatingIncome","ebit"]);
  const netIncome = sumQ(q,["netIncome","bottomLineNetIncome"]);
  const b0 = bal[0]||{};
  const totalDebt = pick(b0,["totalDebt"]) ??
    ((pick(b0,["shortTermDebt","shortTermBorrowings"])||0)+(pick(b0,["longTermDebt"])||0));
  const cashBs = pick(b0,["cashAndShortTermInvestments","cashAndCashEquivalents"])||0;
  const equity = pick(b0,["totalStockholdersEquity","totalEquity"]);
  const cq = cf.slice(0,4);
  const ocf = cq.length ? sumQ(cq,["operatingCashFlow","netCashProvidedByOperatingActivities"]) : null;
  const fcfDirect = cq.length ? sumQ(cq,["freeCashFlow"]) : null;
  const capex = cq.length ? sumQ(cq,["capitalExpenditure"]) : null;
  const fcf = fcfDirect || (ocf!==null && capex!==null ? ocf+capex : null);
  const ev = (marketCap && isFinite(marketCap)) ? marketCap+(totalDebt||0)-cashBs : null;
  const div = (a,b)=> (a&&b&&isFinite(a)&&isFinite(b)) ? a/b : null;
  return {
    ev, evEbitda:div(ev,ebitda), evSales:div(ev,revenue), evEbit:div(ev,ebit),
    evFcf:div(ev,fcf), evOcf:div(ev,ocf), pe:div(marketCap,netIncome),
    pb:div(marketCap,equity), roe:div(netIncome,equity),
    ebitdaMargin:div(ebitda,revenue), netMargin:div(netIncome,revenue)
  };
}

/* Keys a sector actually needs — only these trigger the (3-call) statement fallback. */
const needKeys = sec => {
  const k = [sec.primary, ...sec.secondary];
  if(sec.primary!=="pb") k.push("ebitdaMargin");
  return Array.from(new Set(k));
};

async function fetchTicker(ticker, need, plan){
  const b = plan.base;
  const sym = fmpSym(ticker);

  const [pArr, kmArr, raArr] = await Promise.all([
    plan.hasProfile ? safeArr(URLS.profile(b,sym)) : safeArr(URLS.quote(b,sym)),
    plan.hasKM ? safeArr(URLS.km(b,sym)) : Promise.resolve([]),
    plan.hasRatios ? safeArr(URLS.ratios(b,sym)) : Promise.resolve([])
  ]);
  const p = pArr[0]||{}, km = kmArr[0]||{}, ra = raArr[0]||{};
  const marketCap = pick(p,["marketCap","mktCap"]);

  const out = {
    ev: pick(km,["enterpriseValueTTM","enterpriseValue","evTTM"]),
    evEbitda: pick(km,["evToEBITDATTM","enterpriseValueOverEBITDATTM","evToEbitdaTTM","enterpriseValueMultipleTTM","evToEBITDA"]),
    evSales: pick(km,["evToSalesTTM","evToSales","enterpriseValueOverRevenueTTM"]),
    evFcf: pick(km,["evToFreeCashFlowTTM","evToFreeCashFlow"]),
    evOcf: pick(km,["evToOperatingCashFlowTTM","evToOperatingCashFlow"]),
    evEbit: pick(km,["evToEBITTTM","evToEbitTTM","enterpriseValueOverEBITTTM"]),
    pe: pick(ra,["priceToEarningsRatioTTM","peRatioTTM","priceEarningsRatioTTM"]),
    pb: pick(ra,["priceToBookRatioTTM","pbRatioTTM","priceToBookRatio"]),
    roe: pick(km,["returnOnEquityTTM","returnOnEquity"]) ?? pick(ra,["returnOnEquityTTM","returnOnEquity"]),
    ebitdaMargin: pick(ra,["ebitdaMarginTTM","ebitdaratioTTM","ebitdaMargin"]),
    netMargin: pick(ra,["netProfitMarginTTM","netIncomeMarginTTM","netProfitMargin"])
  };
  let source = (kmArr.length||raArr.length) ? "api" : null;

  /* EV/EBIT is not in key-metrics-ttm, so derive it without extra calls:
     EV/EBIT = (EV/Sales) ÷ (EBIT/Sales). Same for EV/EBITDA if it is missing. */
  const opMargin = pick(ra,["operatingProfitMarginTTM","operatingProfitMargin"]);
  const knownNM = new Set();
  if(out.evEbit===null && out.evSales!==null && opMargin!==null){
    if(opMargin>0) out.evEbit = out.evSales/opMargin; else knownNM.add("evEbit");
  }
  if(out.evEbitda===null && out.evSales!==null && out.ebitdaMargin!==null){
    if(out.ebitdaMargin>0) out.evEbitda = out.evSales/out.ebitdaMargin; else knownNM.add("evEbitda");
  }
  /* a loss-maker has no meaningful P/E — no need to spend statement calls looking for one */
  if(out.pe===null && out.netMargin!==null && out.netMargin<=0) knownNM.add("pe");

  const missing = need.some(k => (out[k]===null || out[k]===undefined || !isFinite(out[k])) && !knownNM.has(k));
  if(plan.hasStatements && missing){
    const c = await computeFromStatements(sym, b, marketCap);
    if(c){
      Object.keys(c).forEach(k=>{
        if(out[k]===null || out[k]===undefined || !isFinite(out[k])) out[k]=c[k];
      });
      source = source==="api" ? "api+computed" : "computed";
    }
  }

  const anyValue = Object.values(out).some(v=>v!==null && v!==undefined && isFinite(v));

  /* CAPM cost of equity from the profile beta */
  const beta = pick(p,["beta"]);
  const coe = (beta!==null && isFinite(beta)) ? RISK_FREE + beta*EQUITY_PREMIUM : null;

  return {
    ticker, sym,
    name: pickStr(p,["companyName","name"]) || (INFO[ticker] && INFO[ticker].name) || ticker,
    industry: INFO[ticker] ? INFO[ticker].industry : "",
    price: pick(p,["price"]),
    marketCap, source,
    ev: out.ev,
    evEbitda: clean(out.evEbitda,"evEbitda"),
    evSales: clean(out.evSales,"evSales"),
    evFcf: clean(out.evFcf,"evFcf"),
    evOcf: clean(out.evOcf,"evOcf"),
    evEbit: clean(out.evEbit,"evEbit"),
    pe: clean(out.pe,"pe"),
    pb: clean(out.pb,"pb"),
    roe: out.roe===null ? null : clean(out.roe,"roe"),
    ebitdaMargin: out.ebitdaMargin,
    netMargin: out.netMargin,
    beta, coe,
    hasData: anyValue
  };
}

async function mapLimit(items, limit, fn, onTick){
  const out = new Array(items.length);
  let i = 0, done = 0;
  async function worker(){
    while(i < items.length){
      const idx = i++;
      try{ out[idx] = await fn(items[idx], idx); }
      catch(e){ out[idx] = {ticker:items[idx], error:e.message||"failed", hasData:false}; }
      done++; if(onTick) onTick(done);
    }
  }
  await Promise.all(Array.from({length:Math.min(limit,items.length)}, worker));
  return out;
}

/* ============================ ANALYSIS ============================ */

function analyse(rows, sector){
  const good = rows.filter(r=>r && !r.error)
    .map(r=>Object.assign({}, r, {industry: INFO[r.ticker] ? INFO[r.ticker].industry : (r.industry||"")}));
  if(!good.length) return null;
  const pKey = sector.primary;
  const keys = [sector.primary, ...sector.secondary];
  const meds = {};
  keys.forEach(m => meds[m] = median(good.map(r=>r[m])));

  const enriched = good.map(r=>{
    const parts = [];
    keys.forEach(m=>{
      const v = r[m];
      if(v===null || v===undefined) return;
      const pr = pctRank(v, good.map(x=>x[m]));
      if(pr===null) return;
      parts.push(METRICS[m].better==="low" ? 1-pr : pr);
    });
    const score = parts.length ? (parts.reduce((a,b)=>a+b,0)/parts.length)*100 : null;
    const rel = (r[pKey]!==null && r[pKey]!==undefined && meds[pKey]) ? r[pKey]/meds[pKey]-1 : null;
    return Object.assign({}, r, {score, rel});
  });

  const valid = enriched.filter(r=>r[pKey]!==null && r[pKey]!==undefined);
  const byP = valid.slice().sort((a,b)=>a[pKey]-b[pKey]);
  const scored = enriched.filter(r=>r.score!==null).sort((a,b)=>b.score-a.score);
  const vals = valid.map(r=>r[pKey]).sort((a,b)=>a-b);

  return {
    rows: enriched, meds, keys,
    cheapest: byP[0]||null,
    richest: byP[byP.length-1]||null,
    bestBlend: scored[0]||null,
    worstBlend: scored[scored.length-1]||null,
    med: meds[pKey],
    q1: vals.length ? vals[Math.floor(vals.length*0.25)] : null,
    q3: vals.length ? vals[Math.floor(vals.length*0.75)] : null,
    nValid: valid.length, nTotal: good.length
  };
}

async function startLoad(force){
  const sec = sectorOf(sectorId);
  const token = ++loadToken;
  destroyCharts();

  if(force){
    diag.probed = false; diag.plan = null; diag.log = [];
    delete cacheRows[sec.id]; delete cacheMeta[sec.id]; storeDel(sec.id);
    sec.tickers.forEach(t=>delete cacheTarget[t]);
    if(targetBySector[sec.id]) delete cacheTarget[targetBySector[sec.id]];
  }

  /* reuse this session's rows, then this browser's cache, before touching the API */
  if(!cacheRows[sec.id]){
    const s = storeGet(sec.id);
    if(s){
      cacheRows[sec.id] = s.rows;
      cacheMeta[sec.id] = {ts:s.ts, fromStore:true};
      if(!diag.plan && s.plan) diag.plan = s.plan;
    }
  }
  if(cacheRows[sec.id]){ showSector(sec); return; }

  $("main").innerHTML = `<div class="card">
    <div class="eyebrow" id="load-cap">Checking which FMP endpoints this key can reach</div>
    <div class="bignum" id="load-num">…</div>
    <div class="prog"><i id="load-bar"></i></div>
    <div class="load-note">${sec.tickers.length} companies · roughly 3 FMP requests each.
      Results are cached in this browser for ${CACHE_HOURS} hours, so revisiting a sector is free.</div>
  </div>`;

  try{
    let plan = diag.plan;
    if(!diag.probed) plan = await runProbe();
    if(token !== loadToken) return;

    if(!plan.reachable){
      const cors = diag.log.some(l=>l.status===0);
      renderError(cors
        ? "The requests never reached Financial Modeling Prep. That is a network or CORS block in the browser, not a data problem — the diagnostics below show the exact failure."
        : "Financial Modeling Prep answered, but rejected every endpoint. The message it returned is in the diagnostics below — usually an invalid key, an exhausted daily limit, or endpoints the plan does not include.");
      return;
    }

    $("load-cap").textContent = "Pulling "+sec.name.toLowerCase()+" peers";
    const need = needKeys(sec);
    const raw = await mapLimit(sec.tickers, 4,
      t => fetchTicker(t, need, plan),
      done => {
        if(token !== loadToken) return;
        const n = $("load-num"), bar = $("load-bar");
        if(n) n.textContent = done+" / "+sec.tickers.length;
        if(bar) bar.style.width = (done/sec.tickers.length*100)+"%";
      });
    if(token !== loadToken) return;

    const rows = raw.filter(Boolean);
    const withData = rows.filter(r=>r && r.hasData).length;
    if(!withData){
      renderError("The endpoints responded during the probe but returned nothing usable for these tickers. See the diagnostics below.");
      return;
    }
    cacheRows[sec.id] = rows;
    cacheMeta[sec.id] = {ts:Date.now(), fromStore:false, missing:rows.length-withData};
    /* only keep a sector in the browser cache if the pull was mostly complete (e.g. not cut off by a daily limit) */
    if(withData/rows.length >= 0.8) storeSet(sec.id, rows, plan);
    showSector(sec);
  }catch(e){
    if(token === loadToken) renderError(e.message || "Request failed");
  }
}

function renderError(msg){
  $("main").innerHTML = `<div class="card err-card">
    <div class="eyebrow">Data request failed</div>
    <p>${esc(msg)}</p>
    <button class="retry" id="retry-btn">Try again</button>
    ${diagHTML()}
  </div>`;
  $("retry-btn").addEventListener("click", ()=>startLoad(true));
}

/* ============================ IMPLIED VALUATION ============================ */

/* Which multiples can be turned into an implied share price, and how. */
const VAL_METHODS = {
  evEbitda:{label:"EV/EBITDA", metric:"ebitda", metricLabel:"EBITDA", ev:true},
  evEbit:{label:"EV/EBIT", metric:"ebit", metricLabel:"EBIT", ev:true},
  pb:{label:"P/B", metric:"bookValue", metricLabel:"book value", ev:false}
};
const targetBySector = {};   /* sector id -> chosen target ticker */
const cacheTarget = {};      /* ticker -> fetched target fundamentals */
let valToken = 0;

const valMethodsFor = sec => [sec.primary, ...sec.secondary].filter(m=>VAL_METHODS[m]);

/* Pull the target's last full fiscal year P&L, latest balance sheet and share count. */
async function fetchTarget(ticker){
  if(cacheTarget[ticker]) return cacheTarget[ticker];
  const plan = diag.plan, b = plan.base;
  const row = (cacheRows[sectorId]||[]).find(r=>r && r.ticker===ticker) || null;

  const pull = sym => Promise.all([
    safeArr(URLS.incomeFY(b,sym)), safeArr(URLS.balance(b,sym)), safeArr(URLS.quote(b,sym))
  ]);
  const sym = (row && row.sym) || fmpSym(ticker);
  let [inc, bal, q] = await pull(sym);

  /* most recent full year first, then first year with an EBITDA or EBIT figure */
  inc = inc.slice().sort((x,y)=>String(pickStr(y,["date"])||"").localeCompare(String(pickStr(x,["date"])||"")));
  const fy = inc.find(r=>pick(r,["ebitda","operatingIncome"])!==null) || null;
  const b0 = bal[0]||{}, qq = q[0]||{};

  const totalDebt = pick(b0,["totalDebt"]) ??
    ((pick(b0,["shortTermDebt","shortTermBorrowings"])||0)+(pick(b0,["longTermDebt"])||0));
  const cash = pick(b0,["cashAndShortTermInvestments","cashAndCashEquivalents"]) || 0;
  const assets = pick(b0,["totalAssets"]), liab = pick(b0,["totalLiabilities"]);
  const bookValue = (assets!==null && liab!==null) ? assets-liab
                  : pick(b0,["totalStockholdersEquity","totalEquity"]);

  const price = pick(qq,["price"]) ?? (row ? row.price : null);
  const mktCap = pick(qq,["marketCap","mktCap"]) ?? (row ? row.marketCap : null);
  let shares = pick(qq,["sharesOutstanding"]), sharesSrc = "shares outstanding";
  if(!shares && mktCap && price){ shares = mktCap/price; sharesSrc = "market cap ÷ price"; }
  if(!shares && fy){ shares = pick(fy,["weightedAverageShsOutDil","weightedAverageShsOut"]); sharesSrc = "FY diluted weighted avg"; }

  const yr = fy ? pick(fy,["fiscalYear","calendarYear"]) : null;
  const T = {
    ticker,
    name: pickStr(qq,["name","companyName"]) || (row && row.name) || (INFO[ticker] && INFO[ticker].name) || ticker,
    ok: !!fy || bookValue!==null,
    year: yr ? String(Math.round(yr)) : (fy ? (pickStr(fy,["date"])||"").slice(0,4) : ""),
    ebitda: fy ? pick(fy,["ebitda","EBITDA"]) : null,
    ebit: fy ? pick(fy,["operatingIncome","ebit"]) : null,
    totalDebt, cash, bookValue,
    balDate: pickStr(b0,["date"]) || "",
    price, shares: shares || null, sharesSrc
  };
  if(T.ok) cacheTarget[ticker] = T;
  return T;
}

function valuationHTML(sec){
  const target = targetBySector[sec.id] || "";
  const opts = viewTickers(sec);
  const inList = opts.includes(target);
  const labels = valMethodsFor(sec).map(m=>VAL_METHODS[m].label).join(" and ");
  const ind = industryOf(sec.id);
  return `<div class="card val-card">
    <div class="val-head">
      <div>

        ${ind==="all" ? "across the whole sector" : "within <strong>"+esc(ind)+"</strong>"} (with the target itself left out

        shares outstanding.</p>
      </div>
      <div class="val-pick">
        <label>Target
          <select id="val-select">
            <option value="">Choose a peer…</option>
            ${opts.map(t=>`<option value="${esc(t)}" ${t===target?"selected":""}>${esc(t)} · ${esc((INFO[t]&&INFO[t].name)||"").slice(0,28)}</option>`).join("")}
          </select>
        </label>
        <label>or any ticker
          <span class="val-inp">

function bindValuation(sec){
  const sel = $("val-select"), inp = $("val-input");
  sel.addEventListener("change", ()=>{
    targetBySector[sec.id] = sel.value;
    inp.value = "";
    showValuation(sec);
  });
  const go = ()=>{
    const t = inp.value.trim().toUpperCase();
    if(!t) return;
    inp.value = t;
    targetBySector[sec.id] = t;
    sel.value = viewTickers(sec).includes(t) ? t : "";
    showValuation(sec);
  };
  $("val-go").addEventListener("click", go);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  showValuation(sec);
}

async function showValuation(sec){
  const body = $("val-body");
  if(!body) return;
  const ticker = targetBySector[sec.id];
  const methods = valMethodsFor(sec);
  if(!ticker){
    body.innerHTML = `<p class="val-empty">Choose a company above to see what the peer median
      ${esc(methods.map(m=>VAL_METHODS[m].label).join(" and "))} implies for its share price.</p>`;
    return;
  }
  if(!diag.plan || !diag.plan.hasStatements){
    body.innerHTML = `<p class="val-empty">This key cannot reach the statement endpoints, so full-year EBITDA,
      EBIT and book value are unavailable and no implied price can be built.</p>`;
    return;
  }
  const token = ++valToken;
  if(!cacheTarget[ticker]) body.innerHTML = `<p class="val-empty">Pulling ${esc(ticker)} statements…</p>`;
  let T = null;
  try{ T = await fetchTarget(ticker); }catch(e){ T = null; }
  if(token !== valToken) return;
  if(!T || !T.ok){
    body.innerHTML = `<p class="val-empty" style="color:${C.s5}">No annual statements came back for ${esc(ticker)}.
      Check the ticker, or open the data source diagnostics at the bottom of the page.</p>`;
    return;
  }
  body.innerHTML = valuationResultHTML(sec, T, methods);
}

function impliedFor(m, T, peers){
  const M = VAL_METHODS[m];
  const med = median(peers.map(r=>r[m]));
  const metric = T[M.metric];
  const out = {m, M, med, metric, gross:null, equity:null, px:null, upside:null, note:null};
  if(med===null){ out.note = "No usable peer median."; return out; }
  if(metric===null || metric===undefined || !isFinite(metric)){ out.note = "Target "+M.metricLabel+" unavailable."; return out; }
  if(metric<=0){ out.note = "Target "+M.metricLabel+" is negative — not meaningful."; return out; }
  out.gross = med*metric;                                  /* EV for EV multiples, equity for P/B */
  out.equity = M.ev ? out.gross - T.totalDebt + T.cash : out.gross;
  if(!T.shares || T.shares<=0){ out.note = "Shares outstanding unavailable."; return out; }
  out.px = out.equity / T.shares;
  out.upside = T.price ? out.px/T.price-1 : null;
  return out;
}

function valuationResultHTML(sec, T, methods){
  const A = currentAnalysis;
  const peers = A.rows.filter(r=>r.ticker!==T.ticker);
  const ind = industryOf(sec.id);
  const results = methods.map(m=>impliedFor(m, T, peers));
  const priced = results.filter(r=>r.px!==null);
  const avg = priced.length>1 ? priced.reduce((s,r)=>s+r.px,0)/priced.length : null;
  const upColor = u => (u===null||!isFinite(u)) ? C.muted : u>0.02 ? C.s1 : u<-0.02 ? C.s5 : C.s3;
  const needsEV = results.some(r=>r.M.ev), needsPB = results.some(r=>!r.M.ev);

  const fact = (k,v,small) => `<div><div class="k">${k}</div><div class="v">${v}${small?`<small>${esc(small)}</small>`:""}</div></div>`;
  const facts = [
    fact("Target", esc(T.ticker)+" · "+esc(T.name)),
    fact("Current price", fprice(T.price)),
    fact("Shares", fshares(T.shares), T.sharesSrc),
    needsEV ? fact("FY"+esc(T.year)+" EBITDA", fmoney(T.ebitda)) : "",
    needsEV ? fact("FY"+esc(T.year)+" EBIT", fmoney(T.ebit)) : "",
    needsEV ? fact("Total debt", fmoney(T.totalDebt), T.balDate) : "",
    needsEV ? fact("Cash & ST inv.", fmoney(T.cash)) : "",
    needsPB ? fact("Book value", fmoney(T.bookValue), "assets − liabilities · "+T.balDate) : ""
  ].join("");

  const card = r => `
    <div class="val-m" style="border-top-color:${r.px===null?C.s3:upColor(r.upside)}">
      <div class="eyebrow">${esc(r.M.label)} method</div>
      <div class="px">${r.px===null ? nm : fprice(r.px)}</div>
      <div class="up" style="color:${upColor(r.upside)}">${
        r.px===null ? esc(r.note||"")
        : r.upside===null ? "current price unavailable"
        : fsigned(r.upside)+" vs "+fprice(T.price)+" current"}</div>
      <div class="val-bridge">
        <div><span>Peer median ${esc(r.M.label)} (ex-${esc(T.ticker)})</span><span>${fx(r.med)}</span></div>
        <div><span>× ${r.M.ev ? "FY"+esc(T.year)+" " : ""}${esc(r.M.metricLabel)}</span><span>${fmoney(r.metric)}</span></div>
        <div class="tot"><span>= Implied ${r.M.ev?"enterprise":"equity"} value</span><span>${fmoney(r.gross)}</span></div>
        ${r.M.ev ? `
        <div><span>− Total debt</span><span>${fmoney(T.totalDebt)}</span></div>
        <div><span>+ Cash &amp; short-term investments</span><span>${fmoney(T.cash)}</span></div>
        <div class="tot"><span>= Implied equity value</span><span>${fmoney(r.equity)}</span></div>` : ""}
        <div><span>÷ Shares outstanding</span><span>${fshares(T.shares)}</span></div>
        <div class="tot"><span>= Implied share price</span><span>${r.px===null ? nm : fprice(r.px)}</span></div>
      </div>
    </div>`;

  const avgCard = avg===null ? "" : `
    <div class="val-m" style="border-top-color:${C.ink}">
      <div class="eyebrow">Average of ${priced.length} methods</div>
      <div class="px">${fprice(avg)}</div>
      <div class="up" style="color:${upColor(T.price?avg/T.price-1:null)}">${
        T.price ? fsigned(avg/T.price-1)+" vs "+fprice(T.price)+" current" : "current price unavailable"}</div>
      <div class="val-bridge">
        ${priced.map(r=>`<div><span>${esc(r.M.label)}</span><span>${fprice(r.px)}</span></div>`).join("")}
      </div>
    </div>`;

  return `
    <div class="val-facts">${facts}</div>
    <div class="val-grid">${results.map(card).join("")}${avgCard}</div>
    <p class="val-note">Peer multiples are TTM; the target's EBITDA and EBIT are its last reported full fiscal year,
    and debt, cash and book value are from its latest balance sheet. Book value is total assets less total liabilities.
    ${peers.length} ${ind==="all" ? esc(sec.name)+" sector" : esc(ind)} peers in the median.
    Screening output only — not investment advice.</p>`;
}

function renderTableBody(sec){
  const A = currentAnalysis;
  const P = sec.primary;
  const TQ = tableQual(P);
  const showInd = industryOf(sec.id)==="all";
  const {col, dir} = sort;
  const rows = A.rows.slice().sort((a,b)=>{
    const av=a[col], bv=b[col];
    const an = av===null||av===undefined||(typeof av==="number"&&!isFinite(av));
    const bn = bv===null||bv===undefined||(typeof bv==="number"&&!isFinite(bv));
    if(an&&bn) return a.ticker.localeCompare(b.ticker);
    if(an) return 1; if(bn) return -1;
    if(typeof av==="string") return dir==="asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return dir==="asc" ? av-bv : bv-av;
  });

  $("comps-body").innerHTML = rows.map(r=>{
    const pv = r[P];
    const pvColor = (pv===null||pv===undefined) ? C.muted : relColor(r.rel, METRICS[P].better);
    const q = r[TQ.key];
    const scoreCell = r.score===null
      ? `<span style="font-family:${MONO};font-size:12px;color:${C.muted}">${nm}</span>`
      : `<span class="scorebar"><span class="trk"><span class="fil" style="width:${r.score}%;background:${relColor(-(r.score-50)/60,"low")}"></span></span><b>${Math.round(r.score)}</b></span>`;
    const qTitle = (TQ.key==="coe" && r.beta!==null && r.beta!==undefined && isFinite(r.beta)) ? ` title="Beta ${r.beta.toFixed(2)}"` : "";
    return `<tr>
      <td class="l tk">${esc(r.ticker)}</td>
      <td class="l co" title="${esc(r.name)}">${esc(r.name)}</td>
      ${showInd ? `<td class="l in" title="${esc(r.industry)}">${esc(r.industry)}</td>` : ""}
      <td class="mn">${fcap(r.marketCap)}</td>
      <td class="pv" style="color:${pvColor}">${fmtM(pv,P)}</td>
      <td class="mn" style="font-size:11.5px;color:${C.muted}">${fsigned(r.rel)}</td>
      ${sec.secondary.map(m=>`<td class="mn">${fmtM(r[m],m)}</td>`).join("")}
      <td class="mn"${qTitle}>${(q===null||q===undefined||!isFinite(q)) ? nm : fpct(q,TQ.dp)}</td>
      <td>${scoreCell}</td>
    </tr>`;
  }).join("");
}

/* ============================ CHARTS ============================ */

const fontMono = {family:"IBM Plex Mono", size:10};

function buildCharts(sec){
  const A = currentAnalysis;
  const P = sec.primary;
  destroyCharts();

  const medianLine = {
    id:"medianLine",
    afterDatasetsDraw(chart, args, opts){
      const {ctx, scales} = chart;
      const axis = opts.axis==="y" ? scales.y : scales.x;
      if(!axis || opts.value===null || opts.value===undefined) return;
      const px = axis.getPixelForValue(opts.value);
      ctx.save();
      ctx.strokeStyle = C.ink; ctx.setLineDash([4,3]); ctx.lineWidth = 1.2;
      ctx.beginPath();
      if(opts.axis==="y"){ ctx.moveTo(chart.chartArea.left,px); ctx.lineTo(chart.chartArea.right,px); }
      else { ctx.moveTo(px,chart.chartArea.top); ctx.lineTo(px,chart.chartArea.bottom); }
      ctx.stroke(); ctx.restore();
    }
  };

  /* primary horizontal bar */
  const prim = A.rows.filter(r=>r[P]!==null && r[P]!==undefined).sort((a,b)=>a[P]-b[P]);
  charts.push(new Chart($("chart-primary"), {
    type:"bar",
    plugins:[medianLine],
    data:{
      labels: prim.map(r=>r.ticker),
      datasets:[{
        data: prim.map(r=>r[P]),
        backgroundColor: prim.map(r=>relColor(r.rel, METRICS[P].better)),
        borderWidth:0
      }]
    },
    options:{
      indexAxis:"y", responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{
        legend:{display:false},
        medianLine:{axis:"x", value:A.med},
        tooltip:{
          backgroundColor:C.ink, titleFont:{family:"IBM Plex Mono",size:11,weight:"600"},
          bodyFont:{family:"IBM Plex Mono",size:11}, displayColors:false, cornerRadius:0,
          callbacks:{
            title: items => { const r = prim[items[0].dataIndex]; return r.ticker+" · "+r.name; },
            label: item => {
              const r = prim[item.dataIndex];
              return [r.industry, METRICS[P].label+": "+fmtM(r[P],P), "vs median: "+fsigned(r.rel),
                      "Value score: "+(r.score===null?nm:Math.round(r.score))];
            }
          }
        }
      },
      scales:{
        x:{grid:{color:C.ruleSoft}, ticks:{font:fontMono, color:C.muted}},
        y:{grid:{display:false}, ticks:{font:{family:"IBM Plex Mono",size:10.5}, color:C.ink70, autoSkip:false}}
      }
    }
  }));

  /* value vs quality scatter */
  const qKey = P==="pb" ? "roe" : "ebitdaMargin";
  const sc = A.rows.filter(r=>r[P]!==null && r[P]!==undefined && r[qKey]!==null && r[qKey]!==undefined && isFinite(r[qKey]));
  const tickerLabels = {
    id:"tickerLabels",
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      ctx.save();
      ctx.font = "9.5px 'IBM Plex Mono'"; ctx.fillStyle = C.ink70; ctx.textAlign = "center";
      chart.getDatasetMeta(0).data.forEach((pt,i)=>{ ctx.fillText(sc[i].ticker, pt.x, pt.y-9); });
      ctx.restore();
    }
  };
  charts.push(new Chart($("chart-scatter"), {
    type:"scatter",
    plugins:[medianLine, tickerLabels],
    data:{datasets:[{
      data: sc.map(r=>({x:r[P], y:r[qKey]*100})),
      backgroundColor: sc.map(r=>relColor(r.rel, METRICS[P].better)),
      pointRadius:5, pointHoverRadius:7
    }]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{
        legend:{display:false},
        medianLine:{axis:"x", value:A.med},
        tooltip:{
          backgroundColor:C.ink, bodyFont:{family:"IBM Plex Mono",size:11},
          titleFont:{family:"IBM Plex Mono",size:11,weight:"600"}, displayColors:false, cornerRadius:0,
          callbacks:{
            title: items => { const r = sc[items[0].dataIndex]; return r.ticker+" · "+r.name; },
            label: item => {
              const r = sc[item.dataIndex];
              return [r.industry, METRICS[P].label+": "+fmtM(r[P],P),
                      (P==="pb"?"ROE: ":"EBITDA margin: ")+fpct(r[qKey]),
                      "vs median: "+fsigned(r.rel)];
            }
          }
        }
      },
      scales:{
        x:{grid:{color:C.ruleSoft}, ticks:{font:fontMono, color:C.muted},
           title:{display:true, text:METRICS[P].label+" → richer", font:{family:"IBM Plex Mono",size:10.5}, color:C.muted}},
        y:{grid:{color:C.ruleSoft}, ticks:{font:fontMono, color:C.muted, callback:v=>v+"%"},
           title:{display:true, text:P==="pb"?"ROE":"EBITDA margin", font:{family:"IBM Plex Mono",size:10.5}, color:C.muted}}
      }
    }
  }));

  /* secondary multiples grouped bar */
  charts.push(new Chart($("chart-secondary"), {
    type:"bar",
    data:{
      labels: A.rows.map(r=>r.ticker),
      datasets: sec.secondary.map((m,i)=>({
        label: METRICS[m].label,
        data: A.rows.map(r=>r[m]),
        backgroundColor: [C.ink,C.s2,C.s4][i%3],
        borderWidth:0
      }))
    },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:C.ink, bodyFont:{family:"IBM Plex Mono",size:11},
          titleFont:{family:"IBM Plex Mono",size:11,weight:"600"}, cornerRadius:0,
          callbacks:{ label: item => {
            const m = sec.secondary[item.datasetIndex];
            return METRICS[m].label+": "+fmtM(item.raw, m);
          }}
        }
      },
      scales:{
        x:{grid:{display:false}, ticks:{font:fontMono, color:C.ink70, maxRotation:60, minRotation:60, autoSkip:false}},
        y:{grid:{color:C.ruleSoft}, ticks:{font:fontMono, color:C.muted}}
      }
    }
  }));
}

/* ============================ METHODOLOGY TAB ============================ */

function renderMethod(){
  const defs = [
    ["EV/EBITDA","Enterprise value over trailing EBITDA. Capital-structure neutral, so it compares companies with different debt loads."],
    ["EV/EBIT","Enterprise value over operating profit. Charges each company for the depreciation of its asset base — the primary multiple for asset-heavy sectors."],
    ["EV/Sales","Enterprise value over revenue. The fallback when profits are negative or artificially depressed."],
    ["EV/FCF","Enterprise value over free cash flow. What the whole business actually converts into cash after capex."],
    ["EV/OCF","Enterprise value over operating cash flow. Useful where capex is lumpy, as in energy and real estate."],
    ["P/E","Price over trailing earnings per share. Equity-level, so it already reflects leverage."],
    ["P/B","Price over book value. The core bank multiple, since the balance sheet is the business."],
    ["ROE","Return on equity. Paired with P/B to see whether a low multiple is cheap or deserved."],
    ["Cost of equity","CAPM: risk-free rate plus beta times the equity risk premium. Compare with ROE — a bank earning above its cost of equity should trade above book."]
  ];
  const total = SECTORS.reduce((s,x)=>s+x.tickers.length,0);
  const nInd = SECTORS.reduce((s,x)=>s+x.industries.length,0);
  $("view-method").innerHTML = `
    <div style="margin-bottom:22px">
      <h2>Which multiple, and why</h2>
      <p class="lede">${total} S&amp;P 500 companies across 11 GICS sectors and ${nInd} industries. Each sector is valued on the
      multiple that best reflects how its companies actually make money. The primary multiple drives the ranking;
      the secondary multiples act as a cross-check. Within a sector, pick an industry to benchmark against its closest peers only.</p>
    </div>

    <div class="card tbl-card" style="margin-bottom:26px">
      <div class="tbl-scroll">
        <table class="mtable" style="min-width:760px">
          <thead><tr>
            <th class="l">Sector</th><th class="l">Primary multiple</th>
            <th class="l">Secondary multiple</th><th class="l">Why</th>
          </tr></thead>
          <tbody>
            ${SECTORS.map(s=>`<tr>
              <td><div class="sec">${esc(s.label||s.name)}</div>
                <div class="peers">${s.tickers.length} companies · ${s.industries.length} industries</div>
                ${s.asset ? `<span class="tag">Asset heavy</span>` : ""}</td>
              <td><span class="chip">${METRICS[s.primary].label}</span></td>
              <td class="secm">${s.secondary.map(m=>METRICS[m].label).join(", ")}</td>
              <td class="why">${esc(s.why)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="mgrid">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Why EV/EBIT for asset-heavy sectors</div>
        <p>Industrials, Materials, Energy and Utilities run on plant, fleets, reserves and networks that wear out and
        must be replaced. EBITDA adds that depreciation back, which flatters the most capital-hungry companies and
        makes them look cheaper than they are. EBIT keeps it in, so two companies with the same EBITDA but very different
        reinvestment needs are priced differently. Real Estate is the exception: property depreciation is an accounting
        charge that usually understates value, so it stays on EV/EBITDA.</p>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">How the ranking works</div>
        <ol>
          <li>Pull TTM figures for every company in the sector.</li>
          <li>Optionally narrow to one industry — medians, scores and charts then use only those peers.</li>
          <li>Drop negative and extreme multiples — they carry no signal.</li>
          <li>Rank each company within the peer set on every multiple and average into a 0–100 score, where 100 is the cheapest.</li>
          <li>P/E is scored in every sector alongside the sector-specific multiples, as a common equity-level check. Each multiple carries equal weight.</li>
        </ol>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Implied share price</div>
        <ol>
          <li>Take the peer median multiple (sector or selected industry), leaving the target out of the median.</li>
          <li>EV/EBITDA and EV/EBIT: multiply by the target's last full-year EBITDA or EBIT to get enterprise value, subtract total debt and add cash to get equity value.</li>
          <li>P/B: multiply by book value (total assets less total liabilities) to get equity value directly.</li>
          <li>Divide equity value by shares outstanding and compare with the current price.</li>
        </ol>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Reading the colour</div>
        <div class="scale">${[C.s1,C.s2,C.s3,C.s4,C.s5].map(c=>`<i style="background:${c}"></i>`).join("")}</div>
        <div class="scale-lab"><span>−50% vs median</span><span>median</span><span>+80%</span></div>
        <p style="margin-top:12px">Colour always means the same thing: distance from the peer median.
        Green is a discount, red is a premium. Nothing else on the page is coloured.</p>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">What n.m. means</div>
        <p>Not meaningful. A company with negative EBITDA, negative free cash flow or no earnings cannot be
        ranked on that multiple, so it sits out of the median and the score rather than distorting them.
        Loss-makers show up on EV/Sales instead.</p>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow" style="margin-bottom:12px">Metric definitions</div>
      <div class="defs">
        ${defs.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
      </div>
    </div>

    <p class="footer-note" style="margin-top:20px">Screening output only — not investment advice.</p>`;
}

/* ============================ INIT ============================ */

renderSectorList();
startLoad(false);
</script>
